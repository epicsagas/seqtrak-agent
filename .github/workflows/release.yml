name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Build web GUI
        working-directory: gui
        run: |
          npm ci
          npm run build
          node scripts/third-party-licenses.mjs

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/.claude/skills
          cp "target/${{ matrix.target }}/release/st" dist/
          cp "target/${{ matrix.target }}/release/st-mcp" dist/
          cp -r .claude/skills/seqtrak dist/.claude/skills/
          cp -r gui/dist dist/gui
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md THIRD_PARTY_LICENSES_GUI.md dist/
          tar -C dist -czf "seqtrak-agent-${{ matrix.target }}.tar.gz" \
            st st-mcp gui .claude LICENSE NOTICE THIRD_PARTY_LICENSES.md THIRD_PARTY_LICENSES_GUI.md

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/.claude/skills" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/st.exe" "dist/"
          Copy-Item "target/${{ matrix.target }}/release/st-mcp.exe" "dist/"
          Copy-Item -Recurse ".claude/skills/seqtrak" "dist/.claude/skills/"
          Copy-Item -Recurse "gui/dist" "dist/gui"
          Copy-Item "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES_GUI.md" "dist/"
          Compress-Archive -Path "dist/st.exe", "dist/st-mcp.exe", "dist/gui", "dist/.claude", "dist/LICENSE", "dist/NOTICE", "dist/THIRD_PARTY_LICENSES.md", "dist/THIRD_PARTY_LICENSES_GUI.md" -DestinationPath "seqtrak-agent-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: seqtrak-agent-${{ matrix.target }}
          path: |
            seqtrak-agent-${{ matrix.target }}.tar.gz
            seqtrak-agent-${{ matrix.target }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            install.sh
            install.ps1

  homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'epicsagas' }}
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Render Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          S_DARWIN_ARM=$(shasum -a 256 "seqtrak-agent-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          S_DARWIN_INTEL=$(shasum -a 256 "seqtrak-agent-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          S_LINUX_INTEL=$(shasum -a 256 "seqtrak-agent-x86_64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          S_LINUX_ARM=$(shasum -a 256 "seqtrak-agent-aarch64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          mkdir -p formula
          cat > "formula/seqtrak-agent.rb" <<RUBY
          class SeqtrakAgent < Formula
            desc "Unofficial CLI, MCP server and web GUI for the Yamaha SEQTRAK"
            homepage "https://github.com/epicsagas/seqtrak-agent"
            version "${VERSION}"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/epicsagas/seqtrak-agent/releases/download/v${VERSION}/seqtrak-agent-aarch64-apple-darwin.tar.gz"
              sha256 "${S_DARWIN_ARM}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/epicsagas/seqtrak-agent/releases/download/v${VERSION}/seqtrak-agent-x86_64-apple-darwin.tar.gz"
              sha256 "${S_DARWIN_INTEL}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/epicsagas/seqtrak-agent/releases/download/v${VERSION}/seqtrak-agent-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${S_LINUX_INTEL}"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/epicsagas/seqtrak-agent/releases/download/v${VERSION}/seqtrak-agent-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "${S_LINUX_ARM}"
            end

            def install
              bin.install "st", "st-mcp"
              (pkgshare/"gui").install Dir["gui/*"]
            end

            test do
              assert_match "st #{version}", shell_output("#{bin}/st --version")
            end
          end
          RUBY
          cat "formula/seqtrak-agent.rb"

      - name: Push formula to tap
        if: ${{ env.HAS_TOKEN == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/epicsagas/homebrew-tap.git" tap
          cp formula/seqtrak-agent.rb tap/Formula/seqtrak-agent.rb
          git -C tap add Formula/seqtrak-agent.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula unchanged; nothing to push"
            exit 0
          fi
          git -C tap commit -m "seqtrak-agent ${GITHUB_REF_NAME}"
          git -C tap push

      - name: Warn on missing token
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipped Homebrew tap update"
